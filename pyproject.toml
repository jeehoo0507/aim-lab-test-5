[project]
name = "stage0-kd"
version = "0.1.0"
description = "Stage 0: find a setting where full KD beats CE (DeiT-B -> DeiT-Ti on CUB / Waterbirds)"
requires-python = ">=3.10,<3.13"
dependencies = [
    # PyPI torch 2.9.x wheels for linux x86_64 are CUDA 12.8 builds (sm_50..sm_120, incl. Blackwell).
    # Needs NVIDIA driver >= 570. preflight.py checks torch.cuda.get_arch_list() against the GPUs.
    "torch==2.9.1",
    "torchvision==0.24.1",
    "timm>=1.0.15,<1.1",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "pillow>=10",
    "imagecorruptions==1.1.2",
    "setuptools<81",  # imagecorruptions imports pkg_resources
    "scikit-image>=0.22",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "matplotlib>=3.8",  # Stage 1 fidelity plot
]

[tool.uv]
package = false
# imagecorruptions depends on opencv-python (GUI build, needs libGL.so.1, which containers often lack:
# "ImportError: libGL.so.1"). Drop it; opencv-python-headless above provides the same cv2 module.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]
